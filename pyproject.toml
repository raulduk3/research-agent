[build-system]
requires = ["hatchling==1.27.0", "hatch-vcs==0.5.0"]
build-backend = "hatchling.build"

[project]
name = "research-agent"
dynamic = ["version"]
description = "Research discovery and reproducible forecasting"
requires-python = "==3.12.12"
dependencies = [
    "psycopg[binary]==3.2.10",
    "numpy==2.3.3",
    "scipy==1.16.2",
    "torch==2.14.0",
    "transformers==5.17.0",
    "fastapi==0.118.0",
    "jinja2==3.1.6",
    "markupsafe==3.0.3",
    "uvicorn==0.37.0",
    "httpx==0.28.1",
    "python-multipart==0.0.20",
    "pyarrow>=25.0.1",
    "textual==6.2.1",
]

[tool.hatch.version]
source = "vcs"

[tool.uv]
required-version = "==0.8.22"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "ruff==0.13.0",
    "mypy==1.18.1",
    "pytest==8.4.2",
    "hatchling==1.27.0",
    "hatch-vcs==0.5.0",
]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "pyarrow.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --import-mode=importlib"
pythonpath = ["."]
markers = ["integration: requires an isolated PostgreSQL 17 database"]
