[build-system]
requires = ["hatchling==1.27.0", "hatch-vcs==0.5.0"]
build-backend = "hatchling.build"

[project]
name = "research-agent"
dynamic = ["version"]
description = "Research discovery and reproducible forecasting"
requires-python = "==3.12.12"
dependencies = ["psycopg[binary]==3.2.10"]

[tool.hatch.version]
source = "vcs"

[tool.uv]
required-version = "==0.8.22"

[dependency-groups]
dev = [
    "ruff==0.13.0",
    "mypy==1.18.1",
    "pytest==8.4.2",
    "hatchling==1.27.0",
    "hatch-vcs==0.5.0",
]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["integration: requires an isolated PostgreSQL 17 database"]
