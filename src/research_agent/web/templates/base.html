<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% block title %}Research digest{% endblock %}</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #20211f;
      --muted: #686963;
      --paper: #f4f1e9;
      --surface: #fffdf8;
      --line: #d8d3c6;
      --accent: #1d5b4f;
      --accent-dark: #12463c;
      --accent-soft: #e4eee9;
      --warning: #7b4b18;
      --warning-soft: #f4ead8;
      --error: #8e2d2d;
      --error-soft: #f7e5e1;
      --shadow: 0 18px 48px rgba(45, 41, 31, 0.08);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      line-height: 1.5;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 20rem;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.62), transparent 25rem), var(--paper);
    }

    button, input { font: inherit; }
    button { touch-action: manipulation; }

    .shell {
      width: min(100% - 2rem, 68rem);
      margin-inline: auto;
      padding-block: 1.5rem 4rem;
    }

    .site-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      padding-block: 0.25rem 1.25rem;
      border-bottom: 1px solid var(--line);
    }

    .wordmark {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .site-context {
      margin: 0;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .automated-notice {
      display: flex;
      gap: 0.65rem;
      align-items: flex-start;
      margin: 1rem 0 0;
      padding: 0.75rem 0.9rem;
      color: var(--warning);
      background: var(--warning-soft);
      border: 1px solid #dfc9a5;
      border-radius: 0.35rem;
      font-size: 0.86rem;
      font-weight: 650;
    }

    .automated-notice::before {
      content: "A";
      display: grid;
      flex: 0 0 1.4rem;
      place-items: center;
      width: 1.4rem;
      height: 1.4rem;
      color: var(--surface);
      background: var(--warning);
      border-radius: 50%;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 0.82rem;
      font-weight: 700;
      line-height: 1;
    }

    .page-heading { margin-block: 2.8rem 2rem; }

    .eyebrow {
      margin: 0 0 0.45rem;
      color: var(--accent);
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    h1, h2 {
      font-family: Georgia, "Times New Roman", serif;
      text-wrap: balance;
    }

    h1 {
      max-width: 18ch;
      margin: 0;
      font-size: clamp(2rem, 8vw, 3.6rem);
      font-weight: 500;
      letter-spacing: -0.035em;
      line-height: 1.02;
    }

    .intro {
      max-width: 43rem;
      margin: 0.9rem 0 0;
      color: var(--muted);
      font-size: 1rem;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    :focus-visible {
      outline: 3px solid #b47322;
      outline-offset: 3px;
    }

    @media (min-width: 44rem) {
      .shell {
        width: min(100% - 4rem, 68rem);
        padding-top: 2rem;
      }

      .automated-notice { width: fit-content; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
  {% block styles %}{% endblock %}
</head>
<body>
  <main class="shell">
    <header class="site-header">
      <p class="wordmark">Research digest</p>
      <p class="site-context">Private review</p>
    </header>
    <aside class="automated-notice" aria-label="Automated output notice">
      <span>{{ notice }}</span>
    </aside>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
