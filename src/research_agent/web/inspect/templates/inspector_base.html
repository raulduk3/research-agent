<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% block title %}Research inspector{% endblock %}</title>
<style>
  /* The design mock's tokens and card rules (atoll.css), inline because this app mounts no static files. */
  :root {
    color-scheme: light;
    --paper: #f4f1ea;
    --band: #ebe6d9;
    --ink: #2b2822;
    --ink2: #585144;
    --line: #d6d0c1;
    --mono: "Monaco", "Geneva", ui-monospace, Menlo, "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  body { max-width: 980px; margin: 0 auto; padding: 0 16px 40px; color: var(--ink); background: var(--paper); font: 14px/1.6 var(--mono); }
  a { color: var(--ink); }
  nav.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .brand { font-weight: 700; text-decoration: none; }
  .brand .mark { margin-right: 6px; }
  h1 { margin: 26px 0 6px; font-size: 22px; font-weight: 700; letter-spacing: .01em; }
  h1.identifier-title { font-size: 15px; overflow-wrap: anywhere; }
  h2 { margin: 0; font-size: 15px; font-weight: 700; }
  h3 { margin: 18px 0 6px; color: var(--ink2); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
  .meta, .eyebrow, .breadcrumb, .section-note, .lab { color: var(--ink2); font-size: 12px; }
  .eyebrow { margin: 0; letter-spacing: .06em; text-transform: uppercase; }
  .breadcrumb { margin: 18px 0 0; }
  .inspector-notice { margin: 10px 0 0; }
  .section-stack { display: grid; gap: 10px; margin-top: 16px; }
  .record-section { min-width: 0; padding: 12px 14px; background: #fff; border: 1px solid var(--line); }
  .section-heading { margin-bottom: 10px; padding-bottom: 4px; border-bottom: 1px solid var(--ink2); }
  .metadata-grid { display: grid; margin: 0; }
  .metadata-row { display: grid; grid-template-columns: minmax(9rem, .38fr) minmax(0, 1fr); gap: 14px; padding: 6px 0; border-top: 1px solid var(--line); }
  .metadata-row:first-child { border-top: 0; }
  .metadata-row dt { color: var(--ink2); font-size: 12px; }
  .metadata-row dd { min-width: 0; margin: 0; }
  .raw-value { white-space: pre-wrap; overflow-wrap: anywhere; }
  .raw-id, .id { color: var(--ink2); font-size: 12px; word-break: break-all; }
  .table-region, .tw { max-width: 100%; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  .record-table { min-width: 44rem; }
  .record-table--compact { min-width: 32rem; }
  th, td { padding: 8px 14px 8px 0; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); font-size: 13px; }
  th { color: var(--ink2); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; border-bottom-color: var(--ink2); }
  .empty-state { margin: 0; color: var(--ink2); }
  .pagination { display: flex; justify-content: flex-end; margin: 10px 0 0; }
  .pagination-link { display: inline-block; padding: 9px 16px; border: 1px solid var(--ink); background: #fff; text-decoration: none; }
  .status { padding: 0 6px; border: 1px solid var(--line); background: var(--band); font-size: 12px; }
  details.ids { margin-top: 16px; }
  details.ids summary { color: var(--ink2); font-size: 12px; cursor: pointer; }
  .lab { margin: 22px 0 0; padding: 10px 0 0; border-top: 1px solid var(--line); }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
</style>
</head>
<body>
  <nav class="top"><a class="brand" href="/agents"><span class="mark" aria-hidden="true">🏝️</span>Atoll</a><a href="/agents">agents</a><span class="meta">owner inspection</span></nav>
  <main>
    <aside class="inspector-notice meta" aria-label="Inspector status">
      Read-only storage view. Values are shown as recorded.
    </aside>
    {% block content %}{% endblock %}
  </main>
  <div class="lab">Output of an automated system, not a scientific claim authored by anyone.</div>
</body>
</html>
