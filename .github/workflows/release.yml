# Release lane: the release pull request on main.
#
# Run manually to open or update one release pull request that writes the changelog section from
# conventional commits since the last tag and proposes the next version. Automatic execution on
# every main push is disabled because high-volume worker pushes can make release-please walk too
# much history and fail before it opens the release PR. The release type is `simple` because no
# language manifest exists to carry the version;
# the pull request that adds a toolchain revisits it. Merging that pull request is not a release by
# itself: the engineering owner then creates the annotated vX.Y.Z tag and pushes it, and the tag
# push runs deploy-production.yml. The tag and the GitHub release are deliberately not created here
# (skip-github-release), because a tag created with the workflow token cannot trigger another
# workflow, and the tag push is the production authorization act. No secret is read; the action
# uses the workflow token it is granted below and nothing else. No deploy, no provider call.
# Keep the action pinned to a full commit SHA.
name: release

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Open or update the release pull request
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          release-type: simple
          target-branch: main
          skip-github-release: true
