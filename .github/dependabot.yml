# Dependency updates: GitHub Actions, weekly, grouped into one pull request. Pull requests target
# `develop` and go through the same review as any other change. The pull request that adds a
# language toolchain adds its package ecosystem here.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Chicago"
    target-branch: "develop"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
