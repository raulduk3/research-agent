# The tmux server bin/panes starts on its own socket (`tmux -L swarm`), so
# these settings reach no other tmux session. Each pane carries its run id
# in the pane option @run; the control pane's is `swarm`.
set -g mouse on
set -g pane-border-status top
set -g pane-border-format " #{@run} "
set -g remain-on-exit off

# prefix R retiles now, n and p move to the next and previous run, X closes
# the pane.
bind R run-shell -b "#{@panes_retile}"
bind n select-pane -t :.+
bind p select-pane -t :.-
bind X kill-pane
